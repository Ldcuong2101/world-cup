<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – WC Predict</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      background-image: radial-gradient(ellipse 100% 60% at 50% 0%, #1e3a5f 0%, #0f172a 70%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">

    {# Header #}
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-4"
           style="background:rgba(245,158,11,.15);box-shadow:0 0 40px rgba(245,158,11,.2)">
        <span class="text-4xl">🏆</span>
      </div>
      <h1 class="text-2xl font-extrabold text-white">WC <span class="text-amber-400">Predict</span></h1>
      <p class="text-slate-400 text-sm mt-1">Sign in to make your picks</p>
    </div>

    {# Error flash #}
    {% if flash_msg %}
    <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 6000)"
         class="mb-4 rounded-xl px-4 py-3 bg-red-950/80 border border-red-800/60 text-red-200 text-sm flex items-center gap-2">
      <span>⚠</span><span>{{ flash_msg }}</span>
    </div>
    {% endif %}

    {# Card #}
    <div class="rounded-2xl border border-slate-700/60 p-7"
         style="background:rgba(30,41,59,.7);backdrop-filter:blur(16px)">

      <form method="POST" action="/login" x-data="{ loading: false }" @submit="loading = true">
        <div class="mb-5">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
          <input type="text" name="username" required autofocus autocomplete="username"
                 class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white
                        placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20
                        transition-all duration-200" />
        </div>

        <div class="mb-7">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
          <input type="password" name="password" required autocomplete="current-password"
                 class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white
                        placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20
                        transition-all duration-200" />
        </div>

        <button type="submit"
                :disabled="loading"
                class="w-full font-bold py-3 rounded-xl text-slate-900 text-sm transition-all duration-200
                       bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400
                       disabled:opacity-60 disabled:cursor-not-allowed shadow-lg shadow-amber-500/20">
          <span x-show="!loading">Sign In →</span>
          <span x-show="loading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Signing in…
          </span>
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-600 mt-6">Private group · World Cup 2026</p>
  </div>

</body>
</html>
